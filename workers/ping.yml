name: Keep Alive Ping

on:
  schedule:
    # This runs the action every 15 minutes. 
    # Change the cron syntax if you want a different schedule.
    - cron: '*/5 * * * *'
  # This allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the URL
        run: |
          # Replace the URL below with the website you want to ping
          curl -sSf https://unusualxd-dfr.hf.space > /dev/null
          echo "Ping successful!"
